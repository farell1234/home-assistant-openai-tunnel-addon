name: OpenAI Secure MCP Tunnel
version: "0.0.12-4"
slug: openai_secure_mcp_tunnel
description: >-
  Prywatny, wychodzący tunel HTTPS pomiędzy OpenAI i lokalnym serwerem MCP
  Home Assistanta.
url: https://github.com/farell1234/home-assistant-openai-tunnel-addon
arch:
  - amd64
startup: application
boot: auto
stage: experimental
init: true
ports:
  8080/tcp: 18080
ports_description:
  8080/tcp: Endpoint kontroli zdrowia klienta tunelu
watchdog: http://[HOST]:[PORT:8080]/healthz
options:
  control_plane_tunnel_id: "tunnel_00000000000000000000000000000000"
  control_plane_api_key: null
  home_assistant_access_token: ""
  log_level: info
schema:
  control_plane_tunnel_id: "match(^tunnel_[0-9a-f]{32}$)"
  control_plane_api_key: password
  home_assistant_access_token: password?
  log_level: "list(debug|info|warn)"

configuration:
  control_plane_tunnel_id:
    name: Identyfikator tunelu OpenAI
    description: Identyfikator tunelu utworzonego w OpenAI Platform.
  control_plane_api_key:
    name: Klucz runtime API
    description: Dedykowany klucz OpenAI używany wyłącznie przez klienta tunelu.
  home_assistant_access_token:
    name: Token dostępu Home Assistanta
    description: Token dedykowanego użytkownika ChatGPT; pole jest maskowane i nie trafia do logów.
  log_level:
    name: Poziom logowania
    description: Pozostaw info; debug używaj tylko tymczasowo do diagnostyki.
network:
  8080/tcp: Endpoint kontroli zdrowia klienta tunelu

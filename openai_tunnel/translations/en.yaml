configuration:
  control_plane_tunnel_id:
    name: OpenAI tunnel ID
    description: Tunnel identifier from OpenAI Platform.
  control_plane_api_key:
    name: Runtime API key
    description: Dedicated OpenAI runtime API key used only by tunnel-client.
  home_assistant_access_token:
    name: Home Assistant access token
    description: Token for the dedicated ChatGPT user; the value is masked and never logged.
  log_level:
    name: Log level
    description: Keep info unless temporary diagnostics are required.
network:
  8080/tcp: Tunnel client health endpoint
